    // 统一取属主列表（兼容字符串 / 数组）
    function ownerList(a) {
      return Array.isArray(a.owner) ? a.owner : [a.owner];
    }

    // 属主部门下拉：从数据动态提取（多属主展开），去重注入 select
    function initDeptFilter() {
      var sel = document.getElementById("deptFilter");
      var seen = {};
      APP_LIST.forEach(function (a) {
        ownerList(a).forEach(function (d) {
          if (!seen[d]) {
            seen[d] = true;
            var opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            sel.appendChild(opt);
          }
        });
      });
    }

    // 搜索（应用名称 + 属主）与部门筛选叠加，直接重渲染表格
    function applyFilter() {
      var kw = (document.getElementById("appKeyword").value || "").trim().toLowerCase();
      var dept = document.getElementById("deptFilter").value;
      var rows = APP_LIST.filter(function (a) {
        var hitKw = kw === "" ||
          a.name.toLowerCase().indexOf(kw) >= 0 ||
          ownerList(a).some(function (d) { return d.toLowerCase().indexOf(kw) >= 0; });
        var hitDept = dept === "" || ownerList(a).indexOf(dept) >= 0;
        return hitKw && hitDept;
      });
      renderRows(rows);
    }

    function renderRows(rows) {
      var tbody = document.getElementById("appListBody");
      if (!rows.length) {
        tbody.innerHTML = '<tr><td class="ant-table-cell" colspan="4" style="text-align:center;color:#94a3b8;padding:40px 0;">暂未检索到符合条件的应用，请更换关键字或筛选条件重试。</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function (a) {
        var owners = ownerList(a).map(function (d) {
          return '<span class="ant-tag owner-tag">' + d + '</span>';
        }).join('');
        var link = '../client/app_detail.html?name=' + encodeURIComponent(a.name);
        return '<tr>' +
          '<td class="ant-table-cell" style="font-weight:600;color:#1e293b;">' + a.name + '</td>' +
          '<td class="ant-table-cell" style="color:#64748b;">' + a.desc + '</td>' +
          '<td class="ant-table-cell"><div class="owner-cell">' + owners + '<span class="owner-ellipsis" style="display:none;">…</span></div></td>' +
          '<td class="ant-table-cell"><a href="' + link + '" style="color:#2563eb;">查看应用详情</a></td>' +
        '</tr>';
      }).join('');
      // 属主溢出：逐个 tag 检测是否完整可见，超出容器右边界的整体 display:none，有隐藏显示尾部省略号 + title
      tbody.querySelectorAll(".owner-cell").forEach(function (cell) {
        var tags = Array.prototype.slice.call(cell.querySelectorAll(".owner-tag"));
        var ell = cell.querySelector(".owner-ellipsis");
        tags.forEach(function (t) { t.style.display = "inline-block"; });
        ell.style.display = "none";
        var cellRight = cell.getBoundingClientRect().right;
        var hidden = 0;
        tags.forEach(function (t) {
          if (t.getBoundingClientRect().right > cellRight + 1) {
            t.style.display = "none";
            hidden++;
          }
        });
        if (hidden > 0) {
          ell.style.display = "inline";
          cell.title = tags.map(function (t) { return t.textContent; }).join("、");
        } else {
          ell.style.display = "none";
          cell.removeAttribute("title");
        }
      });
    }

    function resetFilters() {
      document.getElementById("appKeyword").value = "";
      document.getElementById("deptFilter").value = "";
      applyFilter();
    }

    initDeptFilter();
    applyFilter();
  </script>

  <script src="../../assets/footer-loader.js"></script>
