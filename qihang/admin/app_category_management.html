<style>
/* === 分类管理自定义样式 === */
.cat-tree-table{width:100%;border-collapse:collapse;background:#fff}
.cat-tree-table th{padding:12px 16px;text-align:left;font-weight:600;color:rgba(0,0,0,.85);background:#fafafa;border-bottom:1px solid #f0f0f0;font-size:14px;white-space:nowrap}
.cat-tree-table td{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;color:rgba(0,0,0,.65)}

.cat-tree-table .cat-l1-row td{font-weight:500;color:rgba(0,0,0,.85);background:#fff}
.cat-tree-table .cat-l2-row td{background:#fafbfc}
.cat-expand-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:6px;cursor:pointer;border-radius:2px;transition:all .2s;color:rgba(0,0,0,.45);font-size:12px}
.cat-expand-icon:hover{background:#e6f7ff;color:#1890ff}
.cat-expand-icon.collapsed i{transform:rotate(-90deg)}
.cat-expand-icon i{transition:transform .2s}
.cat-l2-icon{margin-right:8px;color:#1890ff;font-size:12px}
.cat-action-link{color:#1890ff;cursor:pointer;margin-right:12px;font-size:13px}
.cat-action-link:hover{color:#40a9ff}
.cat-action-link.danger{color:#ff4d4f}
.cat-action-link.danger:hover{color:#ff7875}
.cat-action-link.sub{color:#52c41a}
.cat-action-link.sub:hover{color:#73d13d}
.cat-tag{display:inline-block;padding:1px 8px;font-size:12px;border-radius:2px;border:1px solid #d9d9d9;color:rgba(0,0,0,.45);margin-left:8px;line-height:20px}
.cat-children-count{font-size:12px;color:rgba(0,0,0,.35);margin-left:6px}
.cat-tree-table th:last-child,.cat-tree-table td:last-child{text-align:center;white-space:nowrap}

.cat-modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000}

<!-- Modal -->
<div class="cat-modal-overlay" id="catModalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="cat-modal">
    <div class="cat-modal-header">
      <h3 class="cat-modal-title" id="catModalTitle">新增分类</h3>
      <button class="cat-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="cat-modal-body">
      <form id="catForm" onsubmit="submitForm(event)">
        <input type="hidden" id="catFormId"/>
        <input type="hidden" id="catFormParentId"/>
        <input type="hidden" id="catFormIsEdit"/>
        <div class="cat-form-item" id="parentNameItem" style="display:none;">
          <label class="cat-form-label" style="display:inline;margin-right:8px;">所属一级分类：</label>
          <span style="font-weight:600;color:rgba(0,0,0,.85);" id="parentNameDisplay"></span>
        </div>
        <div class="cat-form-item">
          <label class="cat-form-label"><span class="required">*</span>分类名称</label>
          <input class="cat-form-input" id="catFormName" placeholder="请输入分类名称（最多20个字符）" maxlength="20" oninput="validateName()"/>
          <div class="cat-form-error" id="catFormNameError">分类名称不能为空</div>
        </div>
        <div class="cat-form-item">
          <label class="cat-form-label"><span class="required">*</span>分类编码</label>
          <input class="cat-form-input" id="catFormCode" placeholder="请输入分类编码（如 KH、JD）" maxlength="10" style="text-transform:uppercase;" oninput="validateCode()"/>
          <div class="cat-form-error" id="catFormCodeError">分类编码不能为空</div>
        </div>
        <div class="cat-modal-footer">
          <button class="ant-btn" type="button" onclick="closeModal()">取消</button>
          <button class="ant-btn ant-btn-primary" type="submit">确定</button>
        </div>
      </form>

<script>
// ====== 数据层 ======
var DEFAULT_CATEGORIES = [
  {id:'l1-1',name:'客户端',code:'KH',children:[
    {id:'l2-101',name:'ToB',code:'KH-TOB'},
    {id:'l2-102',name:'ToC',code:'KH-TOC'}
  ]},
  {id:'l1-2',name:'接触渠道/端',code:'JD',children:[]},
  {id:'l1-3',name:'销售/营销前台',code:'XS',children:[
    {id:'l2-301',name:'销售平台',code:'XS-PT'},
    {id:'l2-302',name:'线上运营平台',code:'XS-OP'}
  ]},
  {id:'l1-4',name:'承保履约前台',code:'CB',children:[
    {id:'l2-401',name:'承保',code:'CB-INS'},
    {id:'l2-402',name:'核保',code:'CB-UND'},
    {id:'l2-403',name:'履约',code:'CB-PERF'}
  ]},
  {id:'l1-5',name:'运营中台',code:'YY',children:[]},
  {id:'l1-6',name:'经营管理平台',code:'JY',children:[]},
  {id:'l1-7',name:'通用中台（双中台）',code:'TY',children:[
    {id:'l2-701',name:'业务中台',code:'TY-BIZ'},
    {id:'l2-702',name:'数据中台',code:'TY-DATA'}
  ]}
];

function loadData(){
  var s=localStorage.getItem('qihang_categories');
  if(s){try{return JSON.parse(s)}catch(e){}}
  return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
}
function saveData(){localStorage.setItem('qihang_categories',JSON.stringify(categories))}

var categories=loadData();
var expandedRows={};

// 默认全部展开
categories.forEach(function(c){if(c.children&&c.children.length)expandedRows[c.id]=true});

// ====== 渲染 ======
function buildRowHTML(cat,level,index,parentId){
  var isChild=!!parentId;
  var rowClass=isChild?'cat-l2-row':'cat-l1-row';
  var hasChild=cat.children&&cat.children.length>0;

  // 序号列
  var idxCell=isChild?'':('<div class="ant-pro-field-index-column ant-pro-field-index-column-border">'+index+'</div>');

  // 拖拽列
  var dragCell='<div class="ant-pro-table-drag-visible-cell"><span aria-label="menu" class="anticon anticon-menu" role="img" style="cursor:grab;color:#999;"><svg aria-hidden="true" data-icon="menu" fill="currentColor" focusable="false" height="1em" viewbox="64 64 896 896" width="1em"><path d="M904 160H120c-4.4 0-8 3.6-8 8v64c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-64c0-4.4-3.6-8-8-8zm0 624H120c-4.4 0-8 3.6-8 8v64c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-64c0-4.4-3.6-8-8-8zm0-312H120c-4.4 0-8 3.6-8 8v64c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-64c0-4.4-3.6-8-8-8z"/></svg></span></div>';

  // 名称列
  var nameCell;
  if(isChild){
    nameCell='<i class="cat-l2-icon">└</i>'+cat.name;
  }else{
    nameCell=hasChild?'<span class="cat-expand-icon'+(expandedRows[cat.id]?'':' collapsed')+'" onclick="toggleExpand(\''+cat.id+'\')"><i>▼</i></span>':'<span style="display:inline-block;width:28px;"></span>';
    nameCell+='<span style="font-weight:600;">'+cat.name+'</span>';
    if(hasChild)nameCell+='<span class="cat-children-count">('+cat.children.length+'个子分类)</span>';
  }

  // 操作列
  var actions='';
  if(!isChild){
    actions+='<a class="cat-action-link sub" onclick="openAddModal(\''+cat.id+'\')">新增子分类</a>';
    actions+='<a class="cat-action-link" onclick="openEditModal(\''+cat.id+'\')">编辑</a>';
    if(!hasChild){
      actions+='<a class="cat-action-link danger" onclick="deleteCategory(\''+cat.id+'\')">删除</a>';
    }else{
      actions+='<span style="color:#ccc;font-size:13px;" title="存在子分类，无法删除">删除</span>';
    }
  }else{
    actions+='<a class="cat-action-link" onclick="openEditModal(\''+cat.id+'\',\''+parentId+'\')">编辑</a>';
    actions+='<a class="cat-action-link danger" onclick="deleteCategory(\''+cat.id+'\')">删除</a>';
  }

  var tdStyle=isChild?'padding-left:40px;':'';
  return '<tr class="'+rowClass+'" id="row-'+cat.id+'">'+
    '<td class="ant-table-cell">'+dragCell+'</td>'+
    '<td class="ant-table-cell">'+idxCell+'</td>'+
    '<td class="ant-table-cell" style="'+tdStyle+'">'+nameCell+'</td>'+
    '<td class="ant-table-cell">'+cat.code+'</td>'+
    '<td class="ant-table-cell">运维账号</td>'+
    '<td class="ant-table-cell">2026-07-29</td>'+
    '<td class="ant-table-cell">2026-07-29 15:00:00</td>'+
    '<td class="ant-table-cell">'+actions+'</td>'+
    '</tr>';
}

function renderTable(){
  categories=loadData();
  var html='',idx=0;
  categories.forEach(function(cat){
    idx++;
    html+=buildRowHTML(cat,1,idx,null);
    if(expandedRows[cat.id]&&cat.children){
      var cIdx=0;
      cat.children.forEach(function(child){
        cIdx++;html+=buildRowHTML(child,2,idx+'.'+cIdx,cat.id);
      });
    }
  });
  if(!html)html='<tr><td colspan="8"><div class="cat-empty-tip"><i>📂</i>暂无分类</div></td></tr>';
  document.getElementById('catTableBody').innerHTML=html;
}

function toggleExpand(id){expandedRows[id]=!expandedRows[id];renderTable()}

// ====== 查找 ======
function findById(id){
  for(var i=0;i<categories.length;i++){
    if(categories[i].id===id)return{cat:categories[i],index:i,parentId:null};
    if(categories[i].children){
      for(var j=0;j<categories[i].children.length;j++){
        if(categories[i].children[j].id===id)return{cat:categories[i].children[j],index:j,parentId:categories[i].id,parentIndex:i};
      }
    }
  }
  return null;
}

// ====== 增删改 ======
function openAddModal(parentId){
  parentId=parentId||null;
  document.getElementById('catFormId').value='';
  document.getElementById('catFormParentId').value=parentId||'';
  document.getElementById('catFormIsEdit').value='0';
  document.getElementById('catFormName').value='';
  document.getElementById('catFormCode').value='';
  document.getElementById('catFormNameError').classList.remove('show');
  document.getElementById('catFormCodeError').classList.remove('show');
  document.getElementById('catFormName').classList.remove('error');
  document.getElementById('catFormCode').classList.remove('error');
  if(parentId){
    var p=findById(parentId);
    document.getElementById('catModalTitle').textContent='新增子分类';
    document.getElementById('parentNameItem').style.display='block';
    document.getElementById('parentNameDisplay').textContent=p.cat.name;
  }else{
    document.getElementById('catModalTitle').textContent='新增一级分类';
    document.getElementById('parentNameItem').style.display='none';
  }
  document.getElementById('catModalOverlay').classList.add('show');
  setTimeout(function(){document.getElementById('catFormName').focus()},100);
}

function openEditModal(id,parentId){
  var f=findById(id);if(!f)return;
  document.getElementById('catFormId').value=f.cat.id;
  document.getElementById('catFormParentId').value=parentId||'';
  document.getElementById('catFormIsEdit').value='1';
  document.getElementById('catFormName').value=f.cat.name;
  document.getElementById('catFormCode').value=f.cat.code;
  document.getElementById('catFormNameError').classList.remove('show');
  document.getElementById('catFormCodeError').classList.remove('show');
  document.getElementById('catFormName').classList.remove('error');
  document.getElementById('catFormCode').classList.remove('error');
  if(parentId){
    var p=findById(parentId);
    document.getElementById('catModalTitle').textContent='编辑子分类';
    document.getElementById('parentNameItem').style.display='block';
    document.getElementById('parentNameDisplay').textContent=p.cat.name;
  }else{
    document.getElementById('catModalTitle').textContent='编辑一级分类';
    document.getElementById('parentNameItem').style.display='none';
  }
  document.getElementById('catModalOverlay').classList.add('show');
}

function closeModal(){document.getElementById('catModalOverlay').classList.remove('show')}

function validateName(){
  var v=document.getElementById('catFormName').value.trim();
  var err=document.getElementById('catFormNameError');
  var inp=document.getElementById('catFormName');
  if(!v){err.textContent='分类名称不能为空';err.classList.add('show');inp.classList.add('error')}
  else if(v.length>20){err.textContent='分类名称最多20个字符';err.classList.add('show');inp.classList.add('error')}
  else{err.classList.remove('show');inp.classList.remove('error')}
}
function validateCode(){
  var v=document.getElementById('catFormCode').value.trim();
  var err=document.getElementById('catFormCodeError');
  var inp=document.getElementById('catFormCode');
  if(!v){err.textContent='分类编码不能为空';err.classList.add('show');inp.classList.add('error')}
  else{err.classList.remove('show');inp.classList.remove('error')}
}

function submitForm(e){
  e.preventDefault();
  var name=document.getElementById('catFormName').value.trim();
  var code=document.getElementById('catFormCode').value.trim().toUpperCase();
  var id=document.getElementById('catFormId').value;
  var parentId=document.getElementById('catFormParentId').value;
  var isEdit=document.getElementById('catFormIsEdit').value==='1';
  var valid=true;
  if(!name||name.length>20){validateName();valid=false}
  if(!code){validateCode();valid=false}
  if(!valid)return;

  if(isEdit){
    var f=findById(id);if(f){f.cat.name=name;f.cat.code=code}
  }else{
    var newId=(parentId?'l2':'l1')+'-'+Date.now();
    var newCat={id:newId,name:name,code:code};
    if(parentId){
      newCat.children=null;
      var pf=findById(parentId);
      if(pf){
        if(!pf.cat.children)pf.cat.children=[];
        pf.cat.children.push(newCat);
        expandedRows[parentId]=true;
      }
    }else{
      newCat.children=[];
      categories.push(newCat);
    }
  }
  saveData();closeModal();renderTable();
}

function deleteCategory(id){
  var f=findById(id);if(!f)return;
  if(!f.parentId&&f.cat.children&&f.cat.children.length>0){
    alert('该分类下存在子分类，请先删除所有子分类后再删除。');return;
  }
  if(!confirm('确定要删除分类「'+f.cat.name+'」吗？删除后不可恢复。'))return;
  if(f.parentId!==null&&f.parentId!==undefined){
    categories[f.parentIndex].children.splice(f.index,1);
  }else{
    categories.splice(f.index,1);
  }
  delete expandedRows[id];
  saveData();renderTable();
}

renderTable();
</script>
