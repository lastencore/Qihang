<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启航平台 · 应用地图 (金字塔方案三·修正)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.hero{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#eef2f7 0%,#f8fafc 50%,#fff 100%);overflow:hidden}
/* 装饰光斑 */
.hero::after{content:"";position:absolute;top:0;right:0;width:50vw;height:100%;background:radial-gradient(ellipse at 75% 40%,rgba(37,99,235,.05),transparent 65%);pointer-events:none}

/* 顶部标题 */
.hero-label{position:absolute;top:3.5vh;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none}
.hero-label .badge{display:inline-block;padding:4px 14px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:12px;font-weight:600;margin-bottom:8px;letter-spacing:.5px;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.hero-label h1{font-size:clamp(22px,2.6vw,34px);font-weight:800;color:#0f172a;line-height:1.15}
.hero-label h1 span{color:#2563eb}
.hero-label p{font-size:12px;color:#94a3b8;margin-top:6px}

/* 金字塔 + 卡片整体容器 */
.arch-stage{position:relative;width:100%;max-width:1300px;height:100%;display:flex;align-items:center;justify-content:center;padding:0 24px 6vh}
/* 中间金字塔 */
.pyramid-box{position:relative;flex:0 0 auto;width:46%;height:88%;max-width:540px}
.pyramid-box svg{position:absolute;inset:0;width:100%;height:100%}

/* 左右列说明卡 */
.col{position:absolute;top:0;bottom:0;width:27%;max-width:320px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:6vh 0}
.col.left{left:0}
.col.right{right:0}

/* 说明卡 */
.info-card{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 2px 10px rgba(15,23,42,.05);cursor:pointer;transition:all .2s}
.info-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.1);border-color:#cbd5e1}
.info-card.right-card{flex-direction:row-reverse}
.ic-stripe{flex-shrink:0;width:4px;align-self:stretch;border-radius:2px}
.ic-body{flex:1;min-width:0}
.ic-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.ic-num{font-size:11px;font-weight:800;color:#94a3b8}
.ic-subs{font-size:11px;color:#64748b;margin-bottom:3px;line-height:1.4}
.ic-desc{font-size:10px;color:#94a3b8;line-height:1.45}

@media(max-width:900px){.arch-stage{flex-direction:column;gap:10px}.pyramid-box{width:80%;height:50%}.col{position:static;width:100%;flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-label">
    <div class="badge">新一代核心系统</div>
    <h1>启航平台 <span>· 应用地图</span></h1>
    <p>7 层架构 · 53 个核心系统</p>
  </div>
  <div class="arch-stage">
    <!-- 左列说明卡 -->
    <div class="col left" id="colLeft"></div>
    <!-- 中间金字塔 -->
    <div class="pyramid-box">
      <svg id="pyramidSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <!-- 右列说明卡 -->
    <div class="col right" id="colRight"></div>
  </div>
</div>

<script>
var LAYERS = [
  { id:"01", name:"客户层",          subs:"ToC · ToB",                  desc:"个人与团体客户全触点覆盖，多角色差异化入口",    color:"#e61c24", light:"#f87171", dark:"#991b1b" },
  { id:"02", name:"接触渠道 / 端",   subs:"App · 小程序 · PC · API",    desc:"多终端统一管理，跨渠道一致体验",                color:"#f97316", light:"#fb923c", dark:"#c2410c" },
  { id:"03", name:"销售 / 营销前台", subs:"智能一体化销售 · 线上运营",   desc:"报价出单到活动营销一站式工具集",                color:"#0ea5e9", light:"#38bdf8", dark:"#0369a1" },
  { id:"04", name:"承保履约前台",    subs:"专业承保核保 · 综合履约",     desc:"核保引擎驱动，保单全生命周期闭环",             color:"#059669", light:"#34d399", dark:"#047857" },
  { id:"05", name:"运营中台",        subs:"流程调度 · 工单 · 服务编排",  desc:"跨线运营能力复用，统一调度与服务编排",          color:"#6366f1", light:"#818cf8", dark:"#4338ca" },
  { id:"06", name:"经营管理平台",    subs:"产品 · 定价 · 风控 · 精算 · 再保", desc:"经营决策与管控支撑，驱动精细化业务管理",     color:"#d97706", light:"#fbbf24", dark:"#92400e" },
  { id:"07", name:"通用中台",        subs:"业务中台 · 数据中台",         desc:"组织权限、数据能力等底层能力统一供给",          color:"#7c3aed", light:"#a78bfa", dark:"#5b21b6" }
];

// 渲染说明卡到左右两列（左边奇数层，右边偶数层）
function renderCards() {
  var colL = document.getElementById('colLeft');
  var colR = document.getElementById('colRight');
  colL.innerHTML = '';
  colR.innerHTML = '';
  LAYERS.forEach(function(layer, i) {
    var html =
      '<div class="info-card '+(i % 2 === 0 ? '' : 'right-card')+'">'+
        '<div class="ic-stripe" style="background:'+layer.color+'"></div>'+
        '<div class="ic-body">'+
          '<div class="ic-title"><span class="ic-num">'+layer.id+'</span> '+layer.name+'</div>'+
          '<div class="ic-subs">'+layer.subs+'</div>'+
          '<div class="ic-desc">'+layer.desc+'</div>'+
        '</div>'+
      '</div>';
    if (i % 2 === 0) colL.innerHTML += html;
    else colR.innerHTML += html;
  });
}

var svg = document.getElementById('pyramidSvg');
var box = document.querySelector('.pyramid-box');

function draw() {
  var w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;

  var N = LAYERS.length;
  var topRx = 22, bottomRx = Math.min(w*0.36, 240), ryRatio = 0.1;
  var pyTop = h*0.04, pyBottom = h*0.96;
  var layerH = (pyBottom - pyTop) / N;
  var cx = w / 2;

  var defs = '<defs>';
  LAYERS.forEach(function(l, i) {
    // 金属质感：暗→主→亮→主→暗
    defs += '<linearGradient id="body-'+i+'" x1="0%" y1="0%" x2="100%" y2="0%">'+
      '<stop offset="0%" stop-color="'+l.dark+'"/>'+
      '<stop offset="20%" stop-color="'+l.color+'"/>'+
      '<stop offset="45%" stop-color="'+l.light+'"/>'+
      '<stop offset="65%" stop-color="'+l.color+'"/>'+
      '<stop offset="100%" stop-color="'+l.dark+'"/>'+
      '</linearGradient>';
    defs += '<linearGradient id="cap-'+i+'" x1="0%" y1="0%" x2="0%" y2="100%">'+
      '<stop offset="0%" stop-color="'+l.light+'"/>'+
      '<stop offset="100%" stop-color="'+l.color+'"/>'+
      '</linearGradient>';
    defs += '<linearGradient id="sheen-'+i+'" x1="0%" y1="0%" x2="100%" y2="100%">'+
      '<stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>'+
      '<stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>'+
      '<stop offset="100%" stop-color="rgba(255,255,255,0)"/>'+
      '</linearGradient>';
    defs += '<filter id="shadow-'+i+'"><feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-opacity="0.18"/></filter>';
  });
  defs += '<filter id="text-shadow"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.4"/></filter>';
  defs += '</defs>';

  var layers = '';
  for (var i=N-1; i>=0; i--) {
    var item = LAYERS[i];
    var tTop = i/N, tBottom = (i+1)/N;
    var rTop = topRx + (bottomRx - topRx) * tTop;
    var rBot = topRx + (bottomRx - topRx) * tBottom;
    var ryTop = rTop * ryRatio, ryBot = rBot * ryRatio;
    var yT = pyTop + i * layerH;
    var yB = yT + layerH * 0.95;

    var sidePath = 'M'+(cx-rTop)+' '+yT+
      ' A'+rTop+' '+ryTop+' 0 0 1 '+(cx+rTop)+' '+yT+
      ' L'+(cx+rBot)+' '+yB+
      ' A'+rBot+' '+ryBot+' 0 0 1 '+(cx-rBot)+' '+yB+' Z';
    var sheenPath = 'M'+(cx-rTop)+' '+yT+
      ' A'+rTop+' '+ryTop+' 0 0 1 '+(cx+rTop)+' '+yT+
      ' L'+(cx+rBot)+' '+yB+
      ' L'+(cx-rBot)+' '+yB+' Z';
    var numY = yT + layerH*0.36;
    var nameY = yT + layerH*0.58;

    layers += '<g class="pyramid-layer" id="layer-'+i+'" filter="url(#shadow-'+i+')">'+
      '<path d="'+sidePath+'" fill="url(#body-'+i+')" stroke="rgba(255,255,255,0.35)" stroke-width="0.7"/>'+
      '<path d="'+sheenPath+'" fill="url(#sheen-'+i+')"/>'+
      '<ellipse cx="'+cx+'" cy="'+yT+'" rx="'+rTop+'" ry="'+ryTop+'" fill="url(#cap-'+i+')" stroke="rgba(255,255,255,0.6)" stroke-width="0.7"/>'+
      '<text x="'+cx+'" y="'+numY+'" fill="#fff" font-size="14" font-weight="900" text-anchor="middle" dominant-baseline="central" filter="url(#text-shadow)">'+item.id+'</text>'+
      '<text x="'+cx+'" y="'+nameY+'" fill="rgba(255,255,255,0.95)" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">'+item.name+'</text>'+
      '</g>';
  }
  svg.innerHTML = defs + layers;
}

renderCards();
window.addEventListener('resize', function() { requestAnimationFrame(draw); });
new ResizeObserver(function() { requestAnimationFrame(draw); }).observe(box);
requestAnimationFrame(draw);
</script>
</body>
</html>
