<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>启航平台 · 应用地图</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
:root {
    --c-01: #059669; --c-02: #0ea5e9; --c-03: #d97706; --c-04: #dc2626;
    --c-05: #6366f1; --c-06: #7c3aed; --c-07: #2563eb;
}
.hero-banner {
    position: relative; width: 100%; height: 100vh; min-height: 100vh;
    background: #ffffff;
    padding: clamp(16px, 2.5vh, 40px) clamp(20px, 3.5vw, 60px);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.hero-banner::before {
    content: ""; position: absolute; top: -20%; left: -10%;
    width: 50vw; height: 140vh;
    background: linear-gradient(135deg, rgba(241,245,249,0.95) 0%, rgba(226,232,240,0.35) 100%);
    transform: rotate(-18deg); pointer-events: none; z-index: 0;
}
.main-layout {
    position: relative; z-index: 1; width: 100%; max-width: 1760px; height: auto;
    max-height: calc(100vh - 90px);
    display: grid; grid-template-columns: minmax(260px,0.82fr) minmax(480px,1.18fr);
    gap: clamp(16px,2vw,44px); align-items: center; min-width: 0;
}
.left-panel {
    display: flex; flex-direction: column; justify-content: center;
    gap: clamp(24px,3.8vh,52px); height: 100%; max-height: 760px; min-width: 0;
}
.title-group { display: flex; flex-direction: column; }
.title-group h1 {
    font-size: clamp(32px,3.2vw,54px); font-weight: 900; line-height: 1.15;
    color: #0f172a; margin-bottom: 12px; letter-spacing: -1px;
}
.title-group .subtitle {
    font-size: clamp(14px,1.05vw,18px); color: #64748b; font-weight: 500; line-height: 1.5;
}
.metrics-row {
    display: grid; grid-template-columns: repeat(4,1fr);
    gap: clamp(6px,0.8vw,14px); width: 100%;
}
.metric-item {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: clamp(8px,1vh,12px) clamp(8px,0.8vw,12px);
    border-radius: 12px; background: rgba(248,250,252,0.6);
    border: 1px solid rgba(241,245,249,1);
    transition: all 0.25s ease; min-width: 0;
}
.metric-item:hover { background: #ffffff; box-shadow: 0 8px 20px rgba(15,23,42,0.05); transform: translateY(-2px); }
.metric-icon-box {
    width: clamp(36px,2.6vw,50px); height: clamp(36px,2.6vw,50px);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(230,28,36,0.08);
}
.metric-value { font-size: clamp(26px,2.2vw,44px); font-weight: 900; color: #e61c24; line-height: 1; margin-bottom: 4px; font-family: Impact, -apple-system, sans-serif; }
.metric-label { font-size: clamp(12px,0.85vw,15px); font-weight: 700; color: #0f172a; margin-bottom: 2px; white-space: nowrap; }
.metric-desc { font-size: clamp(10px,0.72vw,13px); color: #94a3b8; white-space: nowrap; }
.right-ecosystem {
    position: relative; display: grid;
    grid-template-columns: minmax(280px,1.35fr) minmax(180px,0.65fr);
    gap: clamp(8px,1.2vw,22px); align-items: center;
    height: 100%; max-height: 760px; min-width: 0;
}
.pyramid-container {
    width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; position: relative; min-width: 0;
}
.pyramid-container svg { width: 100%; height: 100%; overflow: visible; }
.system-list {
    display: flex; flex-direction: column; justify-content: space-between;
    height: 100%; gap: clamp(4px,0.8vh,8px); min-width: 0;
}
.system-card {
    flex: 1; display: flex; align-items: center;
    background: #fff; padding: clamp(6px,0.8vh,14px) clamp(8px,0.7vw,14px);
    border-radius: 8px; border: 1px solid #e2e8f0;
    border-left: 4px solid #ccc;
    box-shadow: 0 1px 4px rgba(15,23,42,0.03);
    transition: all 0.2s ease; cursor: pointer; min-width: 0;
}
.system-card:hover {
    transform: translateX(3px); background: #f8fafc;
    box-shadow: 0 4px 14px rgba(15,23,42,0.06);
}
.system-card .card-left { display:flex; flex-direction:column; align-items:center; margin-right:10px; flex-shrink:0; }
.system-card .card-num { font-size:15px; font-weight:900; line-height:1; }
.card-content { flex-grow: 1; min-width: 0; overflow: hidden; }
.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 1px; min-width: 0; }
.card-title {
    font-size: clamp(12px,0.82vw,14px); font-weight: 700; color: #0f172a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-tag {
    font-size: 10px; color: #64748b; background: #f1f5f9;
    padding: 1px 5px; border-radius: 4px; font-weight: 500; flex-shrink: 0;
}
.card-desc { font-size: clamp(10px,0.68vw,11px); color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pyramid-layer { transition: transform 0.25s ease, opacity 0.25s ease; transform-origin: center center; }
.pyramid-layer.active { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.18)); }
.scroll-hint {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; z-index: 100; color: #475569; pointer-events: auto;
}
@keyframes bounce-down {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
}
.arrow-bounce { animation: bounce-down 1.5s ease-in-out infinite; }
@media (max-width: 1024px) {
    .hero-banner { height: auto; min-height: 100vh; padding: 32px 20px; }
    .main-layout { grid-template-columns: 1fr; gap: 40px; }
    .left-panel { max-height: none; }
    .right-ecosystem { max-height: none; height: 580px; }
}
</style>
</head>
<body>
<section class="hero-banner">
    <div class="main-layout">
        <div class="left-panel">
            <div class="title-group">
                <h1>启航平台<br>新一代核心系统 · 应用地图</h1>
                <p class="subtitle">一张地图看懂我们的数字化能力体系</p>
            </div>
            <div class="metrics-row">
                <div class="metric-item">
                    <div class="metric-icon-box" style="background:linear-gradient(135deg,rgba(230,28,36,0.08),rgba(230,28,36,0.02));border:1px solid rgba(230,28,36,0.12);">
                        <svg viewBox="0 0 36 36" fill="none"><path d="M18 3L31 9.5L18 16L5 9.5L18 3Z" fill="#FF5252"/><path d="M5 15L18 21.5L31 15L27.5 13.25L18 18L8.5 13.25L5 15Z" fill="#E61C24"/><path d="M5 21L18 27.5L31 21L27.5 19.25L18 24L8.5 19.25L5 21Z" fill="#B91C1C"/></svg>
                    </div>
                    <div class="metric-value">7</div>
                    <div class="metric-label">大业务领域</div>
                    <div class="metric-desc">覆盖全业务价值链</div>
                </div>
                <div class="metric-item">
                    <div class="metric-icon-box" style="background:linear-gradient(135deg,rgba(230,28,36,0.08),rgba(230,28,36,0.02));border:1px solid rgba(230,28,36,0.12);">
                        <svg viewBox="0 0 36 36" fill="none"><rect x="4" y="4" width="12" height="12" rx="3.5" fill="#FF5252"/><rect x="20" y="4" width="12" height="12" rx="3.5" fill="#E61C24"/><rect x="4" y="20" width="12" height="12" rx="3.5" fill="#E61C24"/><rect x="20" y="20" width="12" height="12" rx="3.5" fill="#B91C1C"/></svg>
                    </div>
                    <div class="metric-value">17</div>
                    <div class="metric-label">二级分类</div>
                    <div class="metric-desc">精细化业务分类</div>
                </div>
                <div class="metric-item">
                    <div class="metric-icon-box" style="background:linear-gradient(135deg,rgba(230,28,36,0.08),rgba(230,28,36,0.02));border:1px solid rgba(230,28,36,0.12);">
                        <svg viewBox="0 0 36 36" fill="none"><ellipse cx="18" cy="9" rx="13" ry="5" fill="#FF7979"/><path d="M5 14C5 16.76 10.82 19 18 19C25.18 19 31 16.76 31 14V11.5C31 14.26 25.18 16.5 18 16.5C10.82 16.5 5 14.26 5 11.5V14Z" fill="#E61C24"/><path d="M5 21.5C5 24.26 10.82 26.5 18 26.5C25.18 26.5 31 24.26 31 21.5V19C31 21.76 25.18 24 18 24C10.82 24 5 21.76 5 19V21.5Z" fill="#B91C1C"/></svg>
                    </div>
                    <div class="metric-value">53</div>
                    <div class="metric-label">核心应用系统</div>
                    <div class="metric-desc">支撑业务高效运行</div>
                </div>
                <div class="metric-item">
                    <div class="metric-icon-box" style="background:linear-gradient(135deg,rgba(230,28,36,0.08),rgba(230,28,36,0.02));border:1px solid rgba(230,28,36,0.12);">
                        <svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="11" r="5" fill="#FF5252"/><path d="M9 27C9 22.03 13.03 18 18 18C22.97 18 27 22.03 27 27V29H9V27Z" fill="#FF5252"/></svg>
                    </div>
                    <div class="metric-value">32,870</div>
                    <div class="metric-label">用户规模</div>
                    <div class="metric-desc">全员数字化协同</div>
                </div>
            </div>
        </div>
        <div class="right-ecosystem" id="rightEcosystem">
            <div class="pyramid-container" id="pyramidContainer">
                <svg id="pyramidSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="system-list" id="systemList"></div>
        </div>
    </div>
    <div class="scroll-hint" id="scrollDownArrow">
        <span class="text-xs tracking-widest" style="opacity:.7;">点击进入地图</span>
        <i class="fa-solid fa-chevron-down text-xl arrow-bounce" style="opacity:.8;"></i>
    </div>
</section>
<script>
(function() {
    var SYSTEM_DATA = [
        { num:"01", title:"前端系统", tag:"4个小类 / 26个系统", desc:"面向客户业务,支持销售管理与服务", color:"#059669", gradStart:"#34d399", gradEnd:"#047857", capStart:"#a7f3d0", capEnd:"#34d399" },
        { num:"02", title:"中端系统", tag:"3个小类 / 14个系统", desc:"承保、履约一体化运营", color:"#0ea5e9", gradStart:"#38bdf8", gradEnd:"#0369a1", capStart:"#bae6fd", capEnd:"#38bdf8" },
        { num:"03", title:"后端系统", tag:"10个小类 / 38个系统", desc:"产品、风控等经营管理", color:"#d97706", gradStart:"#fbbf24", gradEnd:"#92400e", capStart:"#fde68a", capEnd:"#f59e0b" },
        { num:"04", title:"监管报送", tag:"统信/EAST/偿付能力等", desc:"满足监管合规要求", color:"#dc2626", gradStart:"#f87171", gradEnd:"#991b1b", capStart:"#fecaca", capEnd:"#ef4444" },
        { num:"05", title:"业务中台", tag:"2个小类 / 6个系统", desc:"通用业务能力复用支撑", color:"#6366f1", gradStart:"#818cf8", gradEnd:"#4338ca", capStart:"#c7d2fe", capEnd:"#818cf8" },
        { num:"06", title:"数据中台", tag:"3个小类 / 10个系统", desc:"数据能力与分析洞察", color:"#7c3aed", gradStart:"#a78bfa", gradEnd:"#5b21b6", capStart:"#ddd6fe", capEnd:"#a78bfa" },
        { num:"07", title:"工具平台", tag:"8个工具/服务", desc:"技术与安全支撑保障", color:"#2563eb", gradStart:"#60a5fa", gradEnd:"#1d4ed8", capStart:"#bfdbfe", capEnd:"#60a5fa" }
    ];
    var systemListEl = document.getElementById('systemList');
    var pyramidSvg = document.getElementById('pyramidSvg');
    if (!systemListEl || !pyramidSvg) return;

    systemListEl.innerHTML = SYSTEM_DATA.map(function(item, i) {
        return '<div class="system-card" id="card-'+i+'" style="border-left-color:'+item.color+';">' +
            '<div class="card-left"><span class="card-num" style="color:'+item.color+';">'+item.num+'</span></div>' +
            '<div class="card-content">' +
                '<div class="card-header">' +
                    '<span class="card-title">'+item.title+'</span>' +
                    '<span class="card-tag">'+item.tag+'</span>' +
                '</div>' +
                '<div class="card-desc">'+item.desc+'</div>' +
            '</div>' +
        '</div>';
    }).join('');

    function drawPyramid() {
        var rect = pyramidSvg.getBoundingClientRect();
        var w = rect.width, h = rect.height;
        if (!w || !h) return;
        pyramidSvg.setAttribute('viewBox','0 0 '+w+' '+h);
        var cards = document.querySelectorAll('.system-card');
        if (!cards.length) return;
        var yPos = Array.from(cards).map(function(c) {
            var r = c.getBoundingClientRect();
            return r.top + r.height/2 - rect.top;
        });
        var N = SYSTEM_DATA.length;
        var cx = w * 0.44, guideX = w * 0.96;
        var topRx = 75, bottomRx = 280, ryRatio = 0.1;
        var defs = '<defs>';
        SYSTEM_DATA.forEach(function(item, i) {
            defs += '<linearGradient id="bg-'+i+'" x1="0%" y1="0%" x2="100%" y2="0%">' +
                '<stop offset="0%" stop-color="'+item.gradStart+'"/>' +
                '<stop offset="40%" stop-color="'+item.color+'"/>' +
                '<stop offset="100%" stop-color="'+item.gradEnd+'"/>' +
                '</linearGradient>';
            defs += '<linearGradient id="cp-'+i+'" x1="0%" y1="0%" x2="0%" y2="100%">' +
                '<stop offset="0%" stop-color="'+item.capStart+'"/>' +
                '<stop offset="100%" stop-color="'+item.capEnd+'"/>' +
                '</linearGradient>';
        });
        defs += '</defs>';
        var lh = (h/N) * 0.70;
        var layers = '';
        for (var i=N-1; i>=0; i--) {
            var item = SYSTEM_DATA[i];
            var cardY = yPos[i];
            var tTop = i/N, tBottom = (i+1)/N;
            var rxTop = topRx + (bottomRx - topRx) * tTop;
            var rxBottom = topRx + (bottomRx - topRx) * tBottom;
            var ryTop = rxTop * ryRatio, ryBottom = rxBottom * ryRatio;
            var yTop = cardY - lh/2;
            var yBottom = yTop + lh;
            var sidePath = 'M '+(cx-rxTop)+' '+yTop+
                ' A '+rxTop+' '+ryTop+' 0 0 1 '+(cx+rxTop)+' '+yTop+
                ' L '+(cx+rxBottom)+' '+yBottom+
                ' A '+rxBottom+' '+ryBottom+' 0 0 1 '+(cx-rxBottom)+' '+yBottom+' Z';
            var textY = yTop + lh * 0.48;
            var lineX = cx + rxTop + (rxBottom - rxTop)*0.5 + 8;
            layers += '<g class="pyramid-layer" id="pyramid-layer-'+i+'">' +
                '<path d="'+sidePath+'" fill="url(#bg-'+i+')" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>' +
                '<ellipse cx="'+cx+'" cy="'+yTop+'" rx="'+rxTop+'" ry="'+ryTop+'" fill="url(#cp-'+i+')" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>' +
                '<text x="'+cx+'" y="'+textY+'" fill="#fff" font-size="14" font-weight="900" text-anchor="middle" dominant-baseline="central" style="filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));">'+item.num+'</text>' +
                '<line x1="'+lineX+'" y1="'+cardY+'" x2="'+guideX+'" y2="'+cardY+'" stroke="'+item.color+'" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>' +
                '<circle cx="'+guideX+'" cy="'+cardY+'" r="3.5" fill="'+item.color+'"/>' +
                '</g>';
        }
        pyramidSvg.innerHTML = defs + layers;
    }

    SYSTEM_DATA.forEach(function(_, i) {
        var card = document.getElementById('card-'+i);
        if (!card) return;
        card.addEventListener('mouseenter', function() {
            var l = document.getElementById('pyramid-layer-'+i);
            if (l) { l.classList.add('active'); l.style.transform='scale(1.03)'; }
        });
        card.addEventListener('mouseleave', function() {
            var l = document.getElementById('pyramid-layer-'+i);
            if (l) { l.classList.remove('active'); l.style.transform='scale(1)'; }
        });
    });
    requestAnimationFrame(drawPyramid);
    window.addEventListener('resize', function() { requestAnimationFrame(drawPyramid); });
    new ResizeObserver(function() { requestAnimationFrame(drawPyramid); }).observe(document.getElementById('rightEcosystem'));
})();
</script>
</body>
</html>
